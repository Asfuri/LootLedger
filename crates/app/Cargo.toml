[package]
name = "lootledger"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lootledger-core = { path = "../core" }
serde_json = "1"
raw-window-handle = "0.6"
notify = "8"
slint = { version = "1.18", default-features = false, features = [
    "std", "compat-1-2", "backend-winit", "accessibility", "raw-window-handle-06", "unstable-winit-030",
] }

[features]
default = ["software"]
software = ["slint/renderer-software", "slint/software-renderer-path", "slint/software-renderer-systemfonts"]
femtovg = ["slint/renderer-femtovg"]

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
