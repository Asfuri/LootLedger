[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/cli"]

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "MIT"

# Small and fast: measured choices are recorded in docs/PERF.md.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
