[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.8.3"
edition = "2024"
license = "MIT"

# Small: optimise for size, one unit, no unwinding, no symbols.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The hot paths keep full speed: drawing, replay decoding, decryption and decompression.
[profile.release.package.i-slint-renderer-software]
opt-level = 3
[profile.release.package.zeno]
opt-level = 3
[profile.release.package.lootledger-core]
opt-level = 3
[profile.release.package.oozextract]
opt-level = 3
[profile.release.package.aes]
opt-level = 3
